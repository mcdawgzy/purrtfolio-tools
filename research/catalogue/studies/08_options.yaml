- id: S110
  slug: spy-qqq-0dte-orb-options-bot
  title: 0DTE SPY/QQQ opening-range breakout options bot
  family: options
  mechanism: intraday-momentum
  source: {type: user, name: "User-supplied 0DTE ORB options bot (IBKR execution)"}
  public_source: "A 0DTE options bot I was sent"
  instruments: [SPY, QQQ]
  products: [option, ETF]
  timeframe: 1m underlying, 0DTE options
  data: SPY 4.5y / QQQ 1y 1m underlying (IBKR); option P&L via Black-Scholes approximation
  tested: 2026-07-02
  closed: 2026-07-02
  verdict: PARKED
  headline: >-
    SPY underlying direction edge is genuine (broad plateau, survives 2022, drop-top-1 3.6%); QQQ none.
    Translated through modelled 0DTE option economics, every variant loses (t=−3.8 to −13.9).
  why: Theta and the spread eat a real but small underlying edge; the option leg was modelled, not quoted, so it is parked rather than disproven.
  variants:
    - {name: "QQQ underlying", verdict: REJECT, result: "No direction edge; OR-width filter insignificant."}
    - {name: "SPY underlying", verdict: LEAD, result: "Robust zero-cost direction edge over 4.5 years."}
    - {name: "SPY 0DTE options (modelled, single barrier and tiered TP ladder)", verdict: REJECT, result: "t=−3.8 to −13.9 at every cost."}
  refs: {scripts: [scripts/eda_0dte_orb_screen.py, scripts/eda_0dte_spy_premium_approx.py, scripts/download_ibkr_0dte_probe.py], prs: [111]}
  visibility: public
  public_summary: >-
    An opening-range breakout on SPY has a real directional edge in the underlying — but buying 0DTE
    options to express it lost money in every version we modelled, because time decay costs more than
    the move pays.

