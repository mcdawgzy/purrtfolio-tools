- id: S112
  slug: sell-0dte-call-verticals-after-drop
  title: Sell 0DTE call credit spreads after a down move (user's live bot)
  public_title: "Sell 0DTE call credit spreads after a down move (my live bot)"
  family: options
  mechanism: short-put-variance-premium
  source: {type: user, name: "User's own live 0DTE bot"}
  public_source: "My own live 0DTE bot"
  instruments: [SPY, QQQ]
  products: [option]
  timeframe: intraday, 4 decision times
  data: SPY 4.5y / QQQ 1m underlying; option P&L via Black-Scholes on realized vol
  tested: 2026-08-23
  closed: 2026-08-23
  verdict: REJECT
  headline: >-
    At every decision time and all three drop measures, selling after a drop did worse than selling
    every day, and selling after a rise did best. Representative config −$0.52/spread.
  why: After an intraday drop the fast upside reversal risk is higher, not lower; any live edge would have to come from implied vol, which this model cannot see.
  refs: {scripts: [scripts/eda_0dte_vertical_selling.py], prs: [203]}
  visibility: public
  public_summary: "My live bot sells 0DTE call spreads after the market drops, on the idea that premium is richer then. In a model of the underlying, selling after a drop did worse than selling every day, and selling after a rise did best. If the bot has an edge, it comes from implied volatility, not from the drop."

- id: S113
  slug: qqq-0dte-put-credit-spreads
  title: QQQ / SPY 0DTE vertical credit spreads — every entry time, width and trigger
  family: options
  mechanism: short-put-variance-premium
  source: {type: user, name: "User /goal request"}
  public_source: "My own options trading"
  instruments: [QQQ, SPY]
  products: [option]
  timeframe: 0DTE, 10:00 and ~13:30–14:00 ET entries
  data: Databento OPRA 1m NBBO 2022-11→2026-08 (46 months, ~184M rows) + IBKR 1m underlying
  tested: 2026-08-30
  closed: 2026-09-01
  verdict: REJECT
  headline: >-
    10am entry: 48-combo grid, every TRAIN t ≤ 0.50. Afternoon put spreads looked strong until split:
    the edge is FOMC-day vol crush (n=24, 100% win). Non-FOMC t=1.09, DSR 0.097.
  why: The apparent edge came from selectivity — rich-premium days, mostly FOMC. Trading by delta on ~65% of days loses.
  lesson: For many-small-wins / rare-big-loss payoffs the t-stat is misleading — report worst loss as a % of max beside it.
  variants:
    - {name: "10:00 entry, 48 combos, calls and puts", verdict: REJECT, result: "Best TRAIN t=0.50 → TEST t=−0.78."}
    - {name: "13:30–14:00 put spread, no stop", verdict: REJECT, result: "88% win; driven by FOMC days."}
    - {name: "FOMC days only (~8/yr)", verdict: LEAD, result: "Replicates on SPY (t=9.93) but the tail is unsampled."}
    - {name: "wider spreads $5 / $10", verdict: REJECT, result: "t rises with width because it is walking toward a naked put."}
    - {name: "debit spreads (buying)", verdict: REJECT, result: "−$11/trade — confirms the cost model."}
    - {name: "delta-based entry", verdict: REJECT, result: "Negative at all deltas, n=589."}
    - {name: "iron condor / call spreads", verdict: REJECT, result: "No edge."}
  refs:
    scripts: [scripts/eda_qqq_0dte_credit_spread_screen.py, scripts/eda_qqq_0dte_credit_spread_screen_v2.py, scripts/eda_qqq_0dte_iron_condor_screen.py, scripts/eda_qqq_0dte_late_entry_neighborhood.py, scripts/eda_qqq_0dte_final_hypotheses.py, scripts/generate_qqq_0dte_credit_spread_tearsheet.py]
    prs: [208, 209, 210]
  visibility: public
  public_summary: >-
    We tested selling 0DTE QQQ and SPY credit spreads on 46 months of real quotes. The only strong
    result came from Fed-announcement days; on ordinary days it lost. Huge t-stats in this kind of
    trade usually mean the big loss has not happened yet.

- id: S114
  slug: letf-put-selling-napkin
  title: '"Napkin" leveraged-ETF put selling (EMA clouds + 5% red day, 30 DTE, GTC 50%)'
  family: options
  mechanism: short-put-variance-premium
  source: {type: social, name: "Social-media post"}
  public_source: "A viral social-media post"
  instruments: [TQQQ, UPRO, SOXL]
  products: [option]
  timeframe: 30 DTE, ~11-day mean hold
  data: synthetic 3× funds from real QQQ/SPY/SOXX daily 2010-08→2026-08; puts priced off 3× VXN/VIX with skew
  tested: 2026-09-18
  closed: 2026-09-18
  verdict: REJECT
  headline: 92.3% win rate but CAGR +1.66% with a −46.2% drawdown vs buy-and-hold +19.71%. Worst trade −63.5%.
  why: Even if every trade won, the capped credit caps the book at +11.9%/yr — below buy-and-hold — so no option-price assumption can save it.
  lesson: For fixed-credit, capped-take premium selling, compute the no-loss ceiling against buy-and-hold first.
  refs: {scripts: [scripts/eda_letf_put_selling.py], prs: [221]}
  visibility: public
  public_summary: >-
    Selling puts on TQQQ/UPRO/SOXL after a 5% red day wins 92% of the time and still made just 1.7% a
    year with a 46% drawdown. Even a world with zero losing trades would trail simply holding QQQ.

- id: S115
  slug: spy-0dte-rsi-1m-scalp
  title: SPY 0DTE 1-minute RSI(30/70) scalp, 15% TP/SL, ≤10 min
  family: options
  mechanism: intraday-mean-reversion
  source: {type: social, name: "Social-media setup card"}
  public_source: "A viral social-media setup card"
  instruments: [SPY]
  products: [option]
  timeframe: 1m, 0DTE ATM
  data: real OPRA 1m bid/ask 2022-11→2026-08 (939 sessions, 6,635 trades)
  tested: 2026-09-18
  closed: 2026-09-18
  verdict: REJECT
  headline: Net −$5.09/contract (t=−16.6); −$2.58 even at mid. A random entry loses −$2.71; the RSI signal sits at the 37th percentile of random.
  why: A long 0DTE ATM option held a few minutes loses to theta before any spread; the RSI cross carries no information.
  lesson: Draw placebo entries at the same minute on other days — a window around the signal is conditioned on its path and gave a false 100th percentile.
  refs:
    prereg: [docs/prereg/2026-09-18_spy_0dte_rsi1m_scalp.md]
    scripts: [scripts/eda_spy_0dte_rsi1m_scalp.py]
    prs: [219]
  visibility: public
  public_summary: >-
    A viral SPY 0DTE scalp — buy calls under RSI 30, puts over 70, 15% target and stop — lost $5 per
    contract on real quotes. Buying a 0DTE option at a random minute loses almost as much; the RSI
    signal adds nothing.

