  data: ThetaData 1m NBBO 2020-01→2026-08; IBKR 1m underlying
  tested: 2026-09-23
  closed: 2026-09-23
  verdict: REJECT
  headline: Site rules +11.2%/trade (t=+2.08) — reproduces their +11.9% — but random entries with the same contract and exits make +3.9%; beats random at t=+1.28 < 1.64.
