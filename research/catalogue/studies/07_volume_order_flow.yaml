- id: S100
  slug: pvrsa-volume-confirmed-sr-breakout
  title: PVRSA / Wyckoff — volume-confirmed support/resistance breakouts (swing)
  family: volume-order-flow
  mechanism: volume-confirmed-support-resistance
  source: {type: user, name: "User /goal request (PVRSA)"}
  public_source: "Volume-price (PVRSA / Wyckoff) ideas I wanted tested"
  instruments: [BTCUSD, XAUUSD]
  products: [CFD, crypto]
  timeframe: 1d, 3–5-day hold
  data: Binance BTC + IBKR gold daily (the only FTMO instruments with real volume)
  tested: 2026-07-21
  closed: 2026-07-22
  verdict: REJECT
  headline: >-
    Volume does add information (high-volume breaks +68.2bp vs low-volume +3.6bp, t=+1.78), but the
    Bitcoin leg inverted out of sample (−30.8bp) and drawdowns hit 47–74%; DSR 0.341.
  why: The effect is real in direction but does not survive an honest out-of-sample split, and gold alone has a Calmar of ~0.15.
  variants:
    - {name: "v1 screen, locked cell N=55 h=5", verdict: NEAR_MISS, result: "Pooled t=+1.55 < 1.64, entirely Bitcoin-carried."}
    - {name: "v2 walk-forward with k×ATR hard stop", verdict: REJECT, result: "BTC TEST −30.8bp; DD 47.4% pooled; DSR 0.341."}
    - {name: "gold-only fundability", verdict: REJECT, result: "~2.5–3.6%/yr vs 20–26% drawdown — 30–50× short of a 10% target."}
  refs:
    prereg: [docs/prereg/2026-07-21_pvrsa_volume_confirmed_sr_swing.md, docs/prereg/2026-07-22_pvrsa_volume_sr_hardstop_wf.md]
    scripts: [scripts/eda_pvrsa_volume_sr.py, scripts/backtest_wf_pvrsa_volume_sr.py, scripts/eda_pvrsa_gold_fundability.py]
    prs: [165, 166]
  visibility: public
  public_summary: >-
    High-volume breakouts of support and resistance really do follow through more than low-volume ones.
    But on Bitcoin the edge reversed out of sample, and on gold it is far too small to be worth the
    drawdowns.

- id: S101
  slug: pvrsa-volume-climax-reversal
  title: PVRSA / Wyckoff — high-volume climax reversal at levels
  family: volume-order-flow
  mechanism: volume-climax-reversal
  source: {type: user, name: "User /goal request (PVRSA)"}
  public_source: "Volume-price (PVRSA / Wyckoff) ideas I wanted tested"
  instruments: [BTCUSD, XAUUSD]
  products: [CFD, crypto]
  timeframe: 1d
  data: Binance BTC + IBKR gold daily, 12 cells
  tested: 2026-07-22
  closed: 2026-07-22
  verdict: REJECT
  headline: No cell has both legs positive. Bitcoin climax "reversals" lose −160.7bp (t=−3.9) to −508.7bp (t=−4.9) — price continues the break.
  why: On this venue a volume climax marks continuation, not exhaustion; the Wyckoff absorption thesis is false here.
  refs:
    prereg: [docs/prereg/2026-07-22_pvrsa_volume_climax_reversal.md]
    scripts: [scripts/eda_pvrsa_climax_reversal.py]
    prs: [167]
  visibility: public
  public_summary: >-
    The Wyckoff idea that a high-volume spike through a level marks exhaustion was backwards on
    Bitcoin: after those spikes price kept going.

- id: S102
  slug: crypto-peer-breadth-thrust
  title: Crypto "peer breadth" thrust (20-coin trading card)
  family: volume-order-flow
  mechanism: market-breadth-thrust
  source: {type: user, name: "User-supplied trading card"}
  public_source: "A crypto trading card I was sent"
  instruments: [Binance USDT pairs (82, incl. 28 delisted)]
  products: [crypto]
  timeframe: 1d, 7–21-day hold
  data: Binance 2017-08→2026-08, causal top-20 universe (4,407 trades)
  tested: 2026-09-08
  closed: 2026-09-09
  verdict: REJECT
  headline: >-
    +1.811%/trade gross (t=+2.67), but a random top-20 coin on the same dates earns +1.756% (62.7th
    percentile). Win rate 5.79% vs the bracket's 25% null; the breadth condition adds +0.376% (t=+0.57).
  why: The profit is being long crypto; the coin pick and the breadth trigger add nothing, and the short leg is five days.
  lesson: A random control must match every filter the signal passed — an unmatched version reported the signal as worse than random.
  refs:
    prereg: [docs/prereg/2026-09-08_crypto_peer_breadth_thrust.md]
    scripts: [scripts/eda_crypto_peer_breadth.py, scripts/eda_crypto_peer_breadth_controls.py, scripts/eda_crypto_peer_breadth_timing.py, scripts/eda_crypto_peer_breadth_sweep.py]
    prs: [216]
  visibility: public
  public_summary: >-
    A crypto "breadth thrust" signal made money — but so did picking a random top-20 coin on the same
    days. The gains were just from being long crypto.

