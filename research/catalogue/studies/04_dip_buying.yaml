  timeframe: 1d, 5-day hold
  data: IBKR daily 2010→2026, TRAIN/TEST split
  tested: 2026-08-20
  closed: 2026-08-20
  verdict: REJECT
  headline: >-
    Edge real (DSR 0.972, TRUE +32.2bp > RANDOM +16.9 > FADE −44.3) but portfolio Sharpe 0.56 vs SPY
    0.73; CAPM alpha +2.65%/yr at t=0.47.
  why: It does not beat buy-and-hold, and Sharpe is leverage-invariant so sizing up cannot fix it. The edge also lives in survivors.
  lesson: The first result where cost was not the binding constraint — the strategy failed on merit.
  variants:
    - {name: "ATR-selectivity (top decile)", verdict: LEAD, result: "Replicates OOS (+117bp top-bottom, t=+3.13) but higher mean comes with higher risk."}
    - {name: "article's $1,000/trade sizing", verdict: REJECT, result: "IBKR $0.35 minimum makes it cost-hostile (Sharpe 0.37)."}
