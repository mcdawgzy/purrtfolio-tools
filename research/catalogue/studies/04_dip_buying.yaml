    prereg: [docs/prereg/2026-08-20_buy_the_dip_ibkr_xs.md]
    scripts: [scripts/eda_buy_the_dip_ibkr_xs.py, scripts/eda_buy_the_dip_ibkr_attribution.py, scripts/eda_buy_the_dip_ibkr_atr_stability.py]
    prs: [193]
  visibility: public
  public_summary: >-
    Buying oversold US stocks works — but over 2010–2026 it earned less than just holding SPY, with a
