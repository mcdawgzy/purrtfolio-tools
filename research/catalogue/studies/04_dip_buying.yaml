- id: S050
  slug: daily-reversal-connors-rsi2
  title: Daily RSI(2) dip-buy on US index CFDs (daily_reversal)
  family: dip-buying
  mechanism: daily-short-term-reversal
  source: {type: paper, name: "Connors & Alvarez 2008; Jegadeesh 1990"}
  paper: P002
  strategies: [daily_reversal]
  instruments: [US100, US500, US30]
  products: [CFD]
  timeframe: 1d, multi-day hold
  data: 15y IBKR/MT5 deep daily; real FTMO swap rates
  tested: 2026-06-03
  verdict: PASS
  headline: >-
    Second strategy to clear the full gate. OOS pooled Sharpe +0.547 (3/3 positive), drawdown 1.81%,
    drop-top-1 survives, DSR 0.995 after adding real overnight swap. ~9–28 trades/yr.
  why: A long-documented short-term reversal premium in US equity indices that survives costs because the hold is multi-day.
  variants:
    - {name: "RSI(2) < 5 / 10 / 15 entry sweep", verdict: PASS, result: "Pre-registered 3-value sweep; DSR computed against it."}
    - {name: "SMA(200) trend filter on", verdict: REJECT, result: "Worse than no filter; shipped without it."}
    - {name: "re-verified with real swap (2026-07-10)", verdict: PASS, result: "OOS Sharpe +0.547, DSR 0.995."}
  refs: {scripts: [scripts/backtest_wf_daily_reversal.py, scripts/backtest_wf_daily_reversal_swing.py, scripts/daily_reversal_sizing.py]}
  visibility: public
  public_summary: >-
    Buying the Nasdaq, S&P and Dow after a sharp two-day drop (RSI(2) oversold) and holding a few days
    passed our full out-of-sample test, including real overnight financing costs.

- id: S051
  slug: dip-intraday
  title: Same-day dip leg — long open→close the morning after RSI(2) < 5 (dip_intraday)
  family: dip-buying
  mechanism: daily-short-term-reversal
  source: {type: internal, name: "40-condition same-day sweep"}
  strategies: [dip_intraday]
  instruments: [US100, US500, US30]
  products: [CFD]
  timeframe: 1m intraday, open→close
  data: deep daily + 2.1y FTMO CFD 1m venue confirm
  tested: 2026-07-02
  verdict: CANDIDATE
  headline: >-
    All six hard criteria pass (OOS t=+3.08, crash-guard DD 2.46%, direction TRUE +18.2bp ≫ FADE −22.0);
    DSR marginal under program-level deflation. 100% of its days are daily_reversal holding days.
  why: The same edge without the overnight hold — an alternative expression, not additional alpha.
  lesson: "The sweep's #1 signal (gap continuation) vanished on real CFD opens — cash-index daily opens are stale prints."
  variants:
    - {name: "RSI(2) < 5 fixed a priori", verdict: CANDIDATE, result: "All hard criteria pass; DSR 0.96–0.98 mechanism-level, 0.85–0.88 at n=40."}
    - {name: "tight 1% stop", verdict: REJECT, result: "Fires on ~30% of dip days and destroys the edge."}
    - {name: "gap-continuation (sweep #1)", verdict: REJECT, result: "Stale-open artefact in cash-index daily bars."}
  refs: {scripts: [scripts/eda_intraday_edge_sweep.py, scripts/backtest_wf_dip_intraday.py, scripts/eda_dip_day_cfd_confirm.py, scripts/eda_dip_day_gate_map.py]}
  visibility: public
  public_summary: >-
    The same oversold-dip signal, traded only from the next day's open to its close, passes every hard
    test but falls just short on our strictest robustness measure. It is the same edge as the
    multi-day version, just without the overnight risk.

