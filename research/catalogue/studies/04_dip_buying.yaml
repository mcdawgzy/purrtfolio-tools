- id: S138
  slug: zscore-scalein-qqq
  title: Z-score(5) scale-in dip-buy on QQQ — 3 tranches, exit above EMA(5)
  family: dip-buying
  mechanism: daily-short-term-reversal
  source: {type: social, name: "X post — z-score scale-in mean reversion model on QQQ (user-pasted 2026-09-30)"}
  public_source: "A trader's post on X"
  instruments: [QQQ, SPY, IWM, DIA, US100]
  products: [ETF, CFD, options]
  timeframe: 1d, 1-7 day hold
  data: IBKR daily, TRAIN 2010-08→2020-12, TEST 2021-01→2026-09; ThetaData QQQ option NBBO 2020-2026
  tested: 2026-09-30
  verdict: PASS
  headline: >-
    Parameters as posted, none swept. PRIMARY 4/4 ETF legs TEST-positive, DSR 0.990 program-level,
    drop-top-1 survives, survives next-open fills. QQQ TEST Sharpe 1.08 vs buy-and-hold 0.78 at a
    drawdown of −9.9% vs −35.6%; TRAIN weaker (0.60 vs 1.04). Options keep at most 40% of the share P&L.
  why: >-
    Buying a 5-day z-score dip in thirds and selling the first close above EMA(5) harvests the same
    short-term reversal premium as RSI(2) (daily-return correlation +0.80), more often (~22 campaigns/yr).
  lesson: >-
    The 87% win rate is averaging-down geometry (avg win +72bp vs avg loss −199bp). A random trigger with the
    same scale-in and exit already reaches Sharpe 0.65 (real at the 79th percentile); the trigger's value is
    in per-campaign return (100th percentile). Found and fixed a missing month (Aug 2021) in the QQQ daily store.
  variants:
    - {name: "as posted, limit-on-close fills", verdict: PASS, result: "4/4 ETF legs TEST-positive; FTMO US100 CFD with swap TEST Sharpe 1.03."}
    - {name: "next-open fills", verdict: PASS, result: "QQQ TEST Sharpe 0.92."}
    - {name: "single full-size entry instead of thirds", verdict: PASS, result: "Similar Sharpe, deeper drawdown (−14.6% vs −9.9%)."}
    - {name: "deep-ITM call per tranche (~0.95×spot, ≥21 DTE)", verdict: PASS, result: "+19bp/campaign vs +47bp in shares; beats random-entry null narrowly (Welch t=1.77)."}
    - {name: "ATM call per tranche (≥14 DTE)", verdict: REJECT, result: "+7.6bp/campaign, t=1.38; no better than random entries."}
    - {name: "bull put spread per tranche (0.98/0.95×spot, ≥10 DTE)", verdict: REJECT, result: "+3.6bp/campaign, t=1.01, despite a 91% win rate."}
  refs: {scripts: [scripts/eda_zscore_scalein_qqq.py, scripts/eda_zscore_scalein_options.py], prs: [240]}
  visibility: public
  public_summary: >-
    A post on X described buying QQQ in thirds after a 5-day z-score dip and selling on the first close above
    the 5-day EMA. It passed our full out-of-sample test on four ETFs, and on QQQ from 2021 it beat
    buy-and-hold on a risk-adjusted basis with a much smaller drawdown (−9.9% vs −35.6%). Expressing it
    through options gave up most of the profit; shares were the better vehicle.

- id: S146
  slug: ibs-addon-daily-reversal
  title: "IBS < 0.1 (close at the day's low) as an add-on to daily_reversal (Build Alpha '24 short-term setups' chart)"
  public_title: "\"Buy the close at the low\": does an IBS signal add to an RSI(2) dip-buy?"
  family: dip-buying
  mechanism: daily-short-term-reversal
  source: {type: social, name: "Build Alpha on X (chart: what happens after 24 popular short-term setups, SPY 2000-2026)"}
  public_source: "A backtesting-software vendor's chart on X ranking 24 popular short-term setups on SPY"
  instruments: [US500, US100, US30, SPY, QQQ, DIA]
  products: [CFD, ETF]
  timeframe: 1d, multi-day hold (exit at the open after the first close above SMA(5))
  data: IBKR cash-index 1d 2011-06→2025-07 (holdout from 2025-07-18 reserved); SPY/QQQ/DIA daily as a venue check
  tested: 2026-10-07
  closed: 2026-10-07
  verdict: REJECT
  headline: >-
    About 52% of IBS<0.1 days are days the live RSI(2)<15 rule misses. Those extra trades make +28bp net on
    US500 (Sharpe 0.73 [0.20, 1.35], 100th percentile of a matched random-entry null), +42bp on US100,
    ~+3bp on US30. But adding them lowers the live book's FTMO P(pass) from 84.8% to 82.0%.
  why: >-
    It is the same dip-buy bet the book already holds (+0.86 correlation on shared days), so it takes slots
    from better-paying legs. DSR 0.33 over 48 variants, and it has faded since 2023 (rolling-12m Sharpe −0.27).
  lesson: >-
    The chart is an event study: 3 of 24 setups cleared a 95% CI, about what chance gives. A variant of an
    edge you already trade is judged on whether it raises the book's pass odds, not on standalone edge.
  variants:
    - {name: "IBS<0.1 extra trades only (headline, US500)", verdict: REJECT, result: "n=196, +28.2bp/trade, Sharpe 0.73; lowers book P(pass) 84.8% → 82.0%."}
    - {name: "RSI(2)<15 OR IBS<0.1 combined (US500)", verdict: REJECT, result: "15.8 → 25.8 trades/yr; Sharpe 0.59 → 0.74; US30 0.10 → 0.07."}
    - {name: "IBS<x standalone, x 0.05-0.25", verdict: REJECT, result: "US500 Sharpe 0.68-0.94, US100 0.94-1.20; same edge as RSI(2), not tested as a replacement trigger."}
    - {name: "IBS>0.9 short (close at the high)", verdict: REJECT, result: "Loses on all three: −10.9 / −18.6 / −29.1bp per trade."}
    - {name: "ETF venue check (real opens)", verdict: PASS, result: "Extra trades SPY +30.9, QQQ +43.6, DIA +11.7bp/trade."}
  refs:
    ledger: "Build Alpha \"What happens after 24 popular short-term setups\" — IBS < 0.1 as an add-on to `daily_reversal` — 2026-10-07"
    scripts: [scripts/eda_ibs_overlap_daily_reversal.py]
    prs: [259]
  visibility: public
  public_summary: >-
    A popular chart showed that buying SPY after it closes near its daily low beats the average week. We checked
    whether that signal adds anything to our live RSI(2) dip-buy. It fires on many new days and those trades do
    make money, but it is the same bet, and adding it slightly lowered our modelled chance of passing a prop-firm
    challenge. Selling strength (closing at the high) lost money on every index.
