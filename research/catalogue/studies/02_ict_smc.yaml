    - {name: "NQ futures cost", verdict: REJECT, result: "Flat before any cost — a cheaper venue cannot help."}
  refs: {scripts: [scripts/eda_aw_model_screen.py, scripts/orb_fade_venue_breakeven.py], prs: [225, 226]}
  visibility: public
  public_summary: "A free sweep → market-structure shift → FVG framework reached its target less often than a coin flip would. It was flat even before costs, so trading it on cheaper futures would not help."

