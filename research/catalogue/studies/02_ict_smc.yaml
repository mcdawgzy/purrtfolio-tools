  products: [ETF, CFD, futures cost model]
  timeframe: 3m RTH
  data: QQQ/SPY 2022-11→2026-08; FTMO CFD 2024-05→2026-07 (1,837 trades)
  tested: 2026-09-23
  closed: 2026-09-23
  verdict: REJECT
  headline: >-
    Pooled gross +0.033R (t=+0.65) even at zero cost. On resolved trades it hit target 18.7% vs a
    22.3% random-walk baseline (z=−3.25); US100 −0.24R, t=−2.53.
  why: It reaches its own structural target less often than a coin flip; the break-even look comes from trades timing out at the close.
  lesson: A time-stopped bracket must be scored on resolved trades only — the naive test read z=+8.42, a false pass.
  variants:
