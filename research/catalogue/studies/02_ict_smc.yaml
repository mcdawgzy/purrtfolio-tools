- id: S141
  slug: pdh-pdl-failed-sweep-fade
  title: "PropQuantX — fade failed sweeps of yesterday's high/low with daily bias (X post)"
  public_title: "Fade failed sweeps of yesterday's high/low, target the other side"
  family: ict-smc
  mechanism: intraday-mean-reversion
  source: {type: social, name: "X @PropQuantX", url: "https://x.com/PropQuantX/status/2105167034690769406"}
  public_source: "A popular X trading account"
  instruments: [NQ, ES, US100]
  products: [futures, CFD]
  timeframe: 5/15/60m signal candle, 1m resolution, flat by 17:00 NY (full Globex session)
  data: NQ / ES 1m Globex 2010-06→2022-10 (3,137 sessions); NQ 5m 2025-05→2026-09; FTMO US100 CFD 1m 2024-05→2026-07
  tested: 2026-10-03
  closed: 2026-10-03
  verdict: REJECT
  headline: >-
    Claimed +$32.6k on NQ 2020–26 (WR 23%, PF 1.19). Best of 9 cells over 12 years of NQ: +0.127R, t=+1.53
    (needs 2.54). Trades that hit stop or target won 17.7% vs an 18.6% coin-flip rate and netted −207R; all
    the profit was trades closed at 17:00. 3/6 pre-registered criteria.
  why: >-
    The sweep-fade bracket reaches the far side of the range no more often than chance. Every cell lost over
    2010–19 and gained over 2020–22, so the post's Jan-2020 start sits in the one favourable regime; ES lost
    in all 12 cells and the FTMO CFD in 11.
  lesson: >-
    A low win rate with a far target produces PF > 1 by geometry alone. Split P&L by exit type, and check the
    years before a vendor backtest starts.
  variants:
    - {name: "Bias = yesterday's candle colour", verdict: REJECT, result: "Best 60m +0.055R, t=+0.59."}
    - {name: "Bias = yesterday's close vs SMA20", verdict: REJECT, result: "Best 60m +0.127R, t=+1.53; drop top-5 trades +0.049R."}
    - {name: "Bias = price vs today's open", verdict: REJECT, result: "5m/15m net-negative (t down to −2.87)."}
    - {name: "Post's own window (NQ 5m 2025–26)", verdict: REJECT, result: "No cell above t=1.2."}
  refs:
    ledger: "PropQuantX \"fade failed sweeps of yesterday's high/low\" — 2026-10-03"
    scripts: [scripts/eda_pdhl_sweep_fade.py]
    prs: [245]
  visibility: public
  public_summary: >-
    "They hunt your stops, so trade the stop hunt": fading failed sweeps of yesterday's high or low reached the
    other side of the range no more often than a coin flip over 12 years of Nasdaq futures. It only looked good
    because its backtest started in 2020.
- id: S147
  slug: ict-1h-sweep-fvg-ifvg-nq
  title: "PropQuantX — automated AmasPFT 'Siphon' ICT strategy: 1h sweep + 6m/7m FVG/IFVG on NQ (X post)"
  public_title: "Sweep of the 1-hour high/low, then a fair-value-gap or inverted-gap entry on 6–7 minute bars"
  family: ict-smc
  mechanism: intraday-mean-reversion
  source: {type: social, name: "X @propquantx (automating @AmasPFT)", url: "https://x.com/propquantx/status/2105291431254557110"}
  public_source: "A popular X trading account automating another trader's ICT strategy"
  instruments: [NQ, US100]
  products: [futures, CFD]
  timeframe: 6m/7m execution bars, 1h levels, 1m resolution, entries 09:30–16:00 NY, flat 16:55
  data: NQ 1m Globex 2010-06→2021-09 (2,821 sessions); FTMO US100 CFD 1m 2024-05→2025-11; NQ 1m 2026-03→2026-09 (post's own window)
  tested: 2026-10-07
  closed: 2026-10-07
  verdict: REJECT
  headline: >-
    Claimed +$34.6k gross on NQ 2021–Feb 2026 (512 trades, PF 1.31) and +$15.4k on a 6-month holdout. No rules
    were published; over 11 years of NQ our readings average +0.004R gross per trade (net −0.039R, t=−1.61) across
    2,797 trades, and the same bracket at the same minute on random days scores the same (56th percentile).
  why: >-
    The sweep-plus-gap entry carries no timing information: trades that hit stop or target won 30.3% vs a 33.3%
    coin-flip rate at 2R, only 3 of 15 timeframe × target settings were positive, and all three ~4-year thirds
    lost. The long side's small gain is the 2010–21 bull market; shorts lost.
  lesson: >-
    A vendor result built on unpublished rules and a 6-month holdout can't be checked; screen pre-declared
    readings over a long history and compare with the same trade at the same minute on random days.
  variants:
    - {name: "Prior 1h candle sweep, 6m, FVG or IFVG (chart top panel)", verdict: REJECT, result: "2,797 trades, gross +0.004R, net −0.039R, t=−1.61; placebo 56th pct."}
    - {name: "Prior 1h candle sweep, 7m, IFVG only (chart bottom panel)", verdict: REJECT, result: "2,337 trades, net −0.052R, t=−2.03; placebo 34th pct."}
    - {name: "1h swing high/low sweep, 6m, FVG or IFVG", verdict: REJECT, result: "1,860 trades, net +0.006R, t=+0.22."}
    - {name: "Timeframe 5–10m × target 1.5/2/3R grid", verdict: REJECT, result: "3 of 15 cells positive, median Sharpe −0.31."}
    - {name: "FTMO US100 CFD (2024–25)", verdict: REJECT, result: "Net +0.012R, t=+0.19; challenge pass rate 0.2%."}
    - {name: "Post's own Mar–Sep 2026 window", verdict: REJECT, result: "Top-panel reading −$1,590 (claim +$15,370); 6 months can't separate either from zero."}
  refs:
    ledger: "PropQuantX \"Siphon\" — AmasPFT's ICT strategy automated, \"default settings\" — 2026-10-07"
    scripts: [scripts/eda_siphon_ict_nq.py]
    prs: [260]
  visibility: public
  public_summary: >-
    "Liquidity sweep, then the gap flips": entering after price takes out the previous hour's high or low and a
    fair-value gap forms (or an old one is broken) did no better than the same trade at the same time on random
    days, over 11 years of Nasdaq futures.
