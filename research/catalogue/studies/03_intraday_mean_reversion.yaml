- id: S046
  slug: discovery-intraday-reversal-sub-spread
  title: Systematic discovery — intraday FX and crypto bar patterns (Runs 003–005)
  family: intraday-mean-reversion
  mechanism: intraday-mean-reversion
  source: {type: internal, name: "Clean-slate discovery engine"}
  instruments: [EURUSD, GBPUSD, USDJPY, BTCUSDT, ETHUSDT]
  products: [FX, crypto]
  timeframe: 15m FX (14.4y), 30m crypto (8.9y)
  data: IBKR 15m FX; Binance 30m crypto; holdout 2023→2026
  tested: 2026-08-10
  closed: 2026-08-10
  verdict: REJECT
  headline: >-
    7 of 9 patterns reproduced out of sample (EURUSD t=12 in-sample; holdout t=3.2–5.6), but every
    one was 4–13× short of the spread. The edge is a one-time shift, flat from 1 to 96 bars.
  why: Short-horizon reversal is real and is bid-ask bounce — by definition uncapturable. Passive limit entry was worse (adverse selection).
  lesson: Report "does it repeat" and "does it pay" separately — they are different questions.
  variants:
    - {name: "Run 003 — 205 intraday conditions", verdict: REJECT, result: "7/9 reproduce OOS; 0 beat the spread."}
    - {name: "Run 004 — holding horizon and selectivity", verdict: REJECT, result: "Flat 1→96 bars; 15 train positives, 0 OOS."}
    - {name: "Run 005 — passive limit entry", verdict: REJECT, result: "Worse than crossing before any cost."}
  refs: {scripts: [scripts/discover_intraday.py, scripts/intraday_cost_frontier.py, scripts/intraday_horizon_scan.py, scripts/passive_entry_test.py], prs: [183]}
  visibility: public
  public_summary: >-
    Short-term reversal in FX and crypto is one of the most reliable patterns we have measured — it
    repeated out of sample in 7 of 9 cases. It is also 4–13 times smaller than the spread, because it is
    mostly the bid-ask bounce itself.

