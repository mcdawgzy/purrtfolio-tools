- id: S042
  slug: low-vol-orb-fade
  title: Low-volatility-gated ORB fade (84% win rate curiosity)
  family: intraday-mean-reversion
  mechanism: intraday-mean-reversion
  source: {type: internal, name: "2026-06-16 regime diagnostic"}
  strategies: [low_vol_fade]
  instruments: [US100, US500, US30]
  products: [CFD]
  timeframe: 1m, 15m opening range
  data: FTMO index CFD 1m
  tested: 2026-06-16
  closed: 2026-06-19
  verdict: REJECT
  headline: >-
    OOS US100 +2.02 (96.6% win) and US500 +2.66, but US30 −0.65 → PRIMARY fail. Two-index
    sensitivity fails robustness: DSR 0.470, kurtosis 44.7.
  why: A short-gamma payoff — many small wins, rare large losses (US30 worst trade −$1,498) that a 6-month window had not yet drawn.
  lesson: A 96% win rate with fat tails is what selling insurance looks like before the claim arrives.
  refs: {scripts: [scripts/eda_orb_lowvol.py, scripts/backtest_wf_low_vol_fade.py]}
  visibility: public
  public_summary: >-
    Fading the opening range on quiet days won 96% of the time on the Nasdaq out of sample — and
    still failed. It was collecting small premiums against rare large losses, and the Dow leg lost.

- id: S043
  slug: orb-5m-failed-breakout-fade
  title: 5-minute OR failed-breakout fade — fixed-% risk, options, futures venue
  family: intraday-mean-reversion
  mechanism: intraday-mean-reversion
  source: {type: user, name: "User-supplied setup (2026-06-22 cycle), re-tested"}
  public_source: "A setup I was sent, re-tested"
  instruments: [US100, US500, US30, QQQ, SPY]
  products: [CFD, ETF, option, futures cost model]
  timeframe: 1m, 5m opening range
  data: FTMO CFD 1.8y + QQQ/SPY 3.3y (3,024 trades)
  tested: 2026-09-02
  closed: 2026-09-22
  verdict: REJECT
  headline: >-
    Direction is real (wins 45.5% vs a 42.6% random-walk null, z=+3.52), but gross +0.0824R against
    0.0808R of cost — a break-even multiplier of 1.02×. Net +0.0016R, +4.8R total vs a 182R drawdown.
  why: >-
    The edge is one spread wide and sits in tiny-wick setups that cannot be filled at the modelled
    price; with a 15%-of-range stop floor it is −0.0088R before any cost.
  lesson: >-
    A product wrapper multiplies edge and cost together; futures round trips are commission-dominated,
    so the saving is NQ-only and micros cost more per point than their parent.
  variants:
    - {name: "CFD, fixed-% risk", verdict: REJECT, result: "Net +0.0016R, t=+0.05."}
    - {name: "long 0/1/2 DTE options (QQQ/SPY, Black-Scholes)", verdict: REJECT, result: "Strictly worse; 1DTE +0.42% on premium, t=+1.43 at zero cost; break-even $1.33/contract."}
    - {name: "15%-of-range stop floor", verdict: REJECT, result: "−0.0088R gross — negative at zero cost."}
    - {name: "futures venue arithmetic (pre-registered, not run)", verdict: REJECT, result: "Cheapest contract NQ at 32% of CFD cost vs a 19.6% drop-top-1 break-even — unreachable."}
  refs:
    prereg: [docs/prereg/2026-09-22_orb_fade_5m_futures_venue.md]
    scripts: [scripts/eda_orb_fade_5m.py, scripts/eda_orb_fade_5m_options.py, scripts/orb_fade_venue_breakeven.py]
    prs: [211, 224]
  visibility: public
  public_summary: >-
    Fading failed 5-minute opening-range breaks has a real directional edge — but it is almost exactly
    one spread wide. Options make it worse, and even Nasdaq futures are not cheap enough to rescue it.

