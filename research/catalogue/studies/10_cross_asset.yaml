- id: S132
  slug: fx-carry-jpy-funded
  title: FX carry — JPY-funded G10 basket (static, vol-timed, drawdown breaker)
  family: cross-asset
  mechanism: fx-carry
  source: {type: paper, name: "Fama 1984; Lustig & Verdelhan 2007; Menkhoff et al. 2012"}
  instruments: [AUDJPY, GBPJPY, USDJPY, USDMXN, USDZAR, USDSEK]
  products: [CFD]
  timeframe: multi-year hold
  data: 26.3y daily; today's verified FTMO swap rates as proxy
  tested: 2026-07-12
  closed: 2026-07-17
  verdict: REJECT
  headline: "Premium real (+74.87% over 26 years, 3/3 legs) but a 61.0% drawdown in 2008. Vol-timing: DD 18.86% > 15%. Hard breaker: 45–52% DD at every threshold."
  why: A carry unwind is sudden; lagging volatility and price stops cannot react in time and whipsaw instead.
  variants:
    - {name: "EM basket", verdict: REJECT, result: "Swap asymmetry — carry income 0.09–0.19bp/night vs 5–10bp spread."}
    - {name: "static G10 JPY-funded", verdict: REJECT, result: "+74.87%, max DD 61.0%."}
    - {name: "vol-timed exit (12% threshold)", verdict: REJECT, result: "TEST +21.51%, DD 18.86%."}
    - {name: "hard DD circuit breaker (5–12%)", verdict: REJECT, result: "TRAIN DD 44.9–51.7% at every X; TEST never read."}
  refs:
    prereg: [docs/prereg/2026-07-17_fx_carry_dd_circuit_breaker.md]
    scripts: [scripts/eda_fx_carry_jpy_funded.py, scripts/backtest_wf_fx_carry_vol_timed.py, scripts/backtest_wf_fx_carry_dd_stop.py]
    prs: [141, 149]
  visibility: public
  public_summary: >-
    Yen-funded FX carry really does pay over 26 years — with a 61% drawdown in 2008. Neither
    volatility timing nor a hard stop could bring that inside a prop firm's limits.

