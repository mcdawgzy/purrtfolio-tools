- id: S130
  slug: vxn-vix-ratio-us100
  title: Long Nasdaq for 10 days when VXN/VIX is in its bottom quartile
  family: cross-asset
  mechanism: cross-asset-implied-vol-state
  source: {type: internal, name: "Discovery Run 006 (exogenous cross-asset state)"}
  instruments: [US100, QQQ]
  products: [CFD, ETF]
  timeframe: 1d, 10-day hold
  data: CBOE VXN/VIX (VXN from 2009-09); 685 candidates screened
  tested: 2026-08-10
  verdict: LEAD
  headline: >-
    Train 67 trades +68.6bp (t=+2.81); holdout 83 trades +114.4bp (t=+2.51), beta-adjusted alpha
    +57.0bp (t=+2.79). Best of 685 (never cleared FDR) and fails drop-top-1 (t 2.54 → 1.11).
  why: The only live lead of 4,286 discovery hypotheses; cost is not binding, frequency is (~11 trades/yr). Now in a pre-registered forward test.
  variants:
    - {name: "US100 leg (original)", verdict: LEAD, result: "Frozen baseline: 163 trades, +85.97bp, t=+3.40."}
    - {name: "Amendment 1 — measurement leg moved to QQQ", verdict: LEAD, result: "Pre-registered; ETF cross-section already 0/164, not re-swept."}
    - {name: "beat buy-and-hold criterion (IBKR)", verdict: LEAD, result: "Pre-registered; in-sample edge over B&H is ~+0.01, so failing it is expected."}
  refs:
    prereg: [docs/prereg/2026-08-12_vxn_vix_us100_forward_test.md, docs/prereg/2026-08-22_vxn_vix_qqq_ibkr_benchmark.md]
    scripts: [scripts/discover_crossasset.py, scripts/forward_test_vxn_vix.py, scripts/download_vix.py]
    prs: [187, 199, 200]
  visibility: public
  public_summary: >-
    Our systematic search found one lead: go long the Nasdaq when its implied volatility is cheap
    relative to the S&P's. It held up on unseen data but rests on about 150 trades, so it is in a
    pre-registered forward test, not in use.

