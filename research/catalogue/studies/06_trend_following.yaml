- id: S142
  slug: gold-45m-ema20
  title: "@invester_trade — gold 45-minute chart × 20 EMA, \"33 wins / 9 losses\" (X post)"
  public_title: "Gold on the 45-minute chart with a 20 EMA"
  family: trend-following
  mechanism: trend-following-ema-reversal
  source: {type: social, name: "X @invester_trade", url: "https://x.com/invester_trade/status/2105238372499521638"}
  public_source: "A popular X trading account"
  instruments: [XAUUSD, GLD]
  products: [CFD, ETF]
  timeframe: 45m bars (1m path for stops/targets); GLD 4h for the long-history check
  data: FTMO XAUUSD 1m 2024-05→2026-06 (2.03y, gold +86%); GLD 4h 2010-08→2026-08
  tested: 2026-10-04
  closed: 2026-10-04
  verdict: REJECT
  headline: >-
    Claimed 78.6% win rate on 42 trades, no rules given. EMA-touch pullback bracket lost before costs at every
    reward:risk (RR 0.33 won 75.3% vs a 75% coin flip). EMA-cross long-only made CAGR +26.1%, MaxDD −12.5%,
    Sharpe 1.28 — below buy & hold (+35.8%, DD −20.1%), DSR 0.80.
  why: >-
    The only reading that made money was "be long gold" during a +86% gold run, with half the exposure. On GLD
    4h 2010–26 the same cross made +5.6% CAGR vs buy & hold +8.2%, its timing was not significant (81st pct
    shift null), and all the profit came in 2023–26. 45m × 20 was not special among its neighbours.
  lesson: >-
    A high win rate with no payoff ratio is just a small target. Gold intraday history is ~2 years of bull
    market — benchmark any gold rule against buy & hold and re-check on GLD back to 2010.
  variants:
    - {name: "EMA cross, stop-and-reverse", verdict: REJECT, result: "CAGR +17.4%, MaxDD −19.0%, Sharpe 0.69, t=+1.18."}
    - {name: "EMA cross, long-only", verdict: REJECT, result: "CAGR +26.1%, MaxDD −12.5%, PF 1.32, WR 24.8%; < buy & hold, DSR 0.80."}
    - {name: "EMA cross, short-only", verdict: REJECT, result: "CAGR −6.9%, MaxDD −29.0%."}
    - {name: "EMA pullback, 1×ATR stop, RR 0.33–2", verdict: REJECT, result: "Gross ≤ $0 at every RR; RR 1.0 CAGR −47.9%, MaxDD −77.5% at 1% risk."}
    - {name: "EMA pullback, exit on close through EMA", verdict: REJECT, result: "CAGR +17.2%, MaxDD −40.3%, t=+0.79."}
    - {name: "GLD 4h EMA20 long, 2010–26", verdict: REJECT, result: "CAGR +5.6% vs buy & hold +8.2%; 10/17 years positive."}
  refs:
    ledger: "@invester_trade \"45-minute chart × 20 EMA\" on gold — 2026-10-04"
    scripts: [scripts/eda_xauusd_45m_ema20.py]
    prs: [253]
  visibility: public
  public_summary: >-
    "45-minute chart, 20 EMA, 78% win rate" on gold: the high-win-rate version loses money before costs, and the
    version that makes money is just being long gold in a bull market — it earned less than buy & hold, and over
    16 years it trailed buy & hold too.

- id: S148
  slug: btcusdt-20-concept-sealed-holdout-hunt
  title: "BTCUSDT 20-concept strategy hunt under a sealed last-third holdout (user brief written for a strategy-builder site)"
  public_title: "Twenty classic Bitcoin strategies vs buy & hold, with the last third of the data locked away"
  family: trend-following
  mechanism: unclassified
  source: {type: user, name: "User-supplied research brief (a tradingkit.com prompt, run without the site)"}
  public_source: "A research brief written for an online strategy-builder"
  instruments: [BTCUSDT]
  products: [spot, perpetual]
  timeframe: one signal timeframe per strategy (1h/4h/1d/1w); fixed exits only; fills walked on 30m bars
  data: Binance BTCUSDT 30m 2017-08→2023-07 (train); 2023-07→2026-06 sealed holdout, unspent
  tested: 2026-10-07
  closed: 2026-10-07
  verdict: REJECT
  headline: >-
    0 of 672 configurations across 20 concepts passed the brief's rules (≥100 trades, drawdown < 20%,
    profit factor > 1.1, beat buy & hold) on 2017–2023, so nothing reached the hidden third. Buy & hold
    made +609% with an 84% drawdown; the best config under 20% drawdown made +291%.
  why: >-
    Beating +609% at 1x without ever losing 20% needs ~39%/yr for six years at a Calmar near 2. Many concepts
    had a real edge (profit factor 1.4–2.5) but every one that out-earned buy & hold drew down ≥34.6%, and
    adding shorts made every family worse after costs.
  lesson: >-
    On an asset that rose 7x, "beat buy & hold with drawdown < 20%" is a Calmar requirement, not an edge
    test; check the return-vs-drawdown frontier before building more variants.
  variants:
    - {name: "NR7 range-contraction breakout, day hold", verdict: REJECT, result: "202 trades, +291%, DD 14.8%, PF 1.87, Sharpe 1.19 — below buy & hold's return; best risk-adjusted config, frozen, holdout unrun."}
    - {name: "Williams volatility breakout (long, two-sided, adaptive k)", verdict: REJECT, result: "Best +621%, but DD 34.6%; two-sided and adaptive versions worse."}
    - {name: "Time-series momentum (daily, weekly)", verdict: REJECT, result: "Up to +1,469%, but DD 64–70%."}
    - {name: "Donchian breakout (long, long/short)", verdict: REJECT, result: "Up to +1,304%, but 53 trades and DD 39–47%."}
    - {name: "Dip-buys, capitulation, pullbacks, EMA cross, squeeze, near-ATH, turn-of-month", verdict: REJECT, result: "All below buy & hold, most with DD 31–71% or under 100 trades."}
    - {name: "Hour-of-day and day-of-week", verdict: REJECT, result: "Hour-of-day gross +13bp vs 30bp round-trip cost; day-of-week PF 1.05."}
  refs:
    ledger: "BTCUSDT 20-concept hunt under a sealed last-third holdout — 2026-10-07"
    scripts: [scripts/btcusdt_holdout_hunt.py]
    prs: [261]
  visibility: public
  public_summary: >-
    Twenty well-known Bitcoin strategies, with fees and slippage included, were asked to make more than buy & hold
    while never losing 20%. None did. The best low-drawdown rule made +291% while buy & hold made +609%, and
    everything that beat buy & hold lost at least a third of the account along the way.
