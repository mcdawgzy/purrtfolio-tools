- id: S083
  slug: time-of-day-window-sweep
  title: Time-of-day window sweep — 134 clock-anchored intraday rules
  family: calendar-events
  mechanism: intraday-time-of-day-seasonality
  source: {type: paper, name: "Heston, Korajczyk & Sadka 2010; Bogousslavsky 2016; Baltussen et al. 2021"}
  instruments: [QQQ, SPY, US100]
  products: [ETF, CFD]
  timeframe: 15m / 1m windows, every session
  data: QQQ 15m 2016–2024 discovery; SPY 15m + FTMO US100 1m confirms
  tested: 2026-07-03
  closed: 2026-07-03
  verdict: REJECT
  headline: Best of 134 (10:00→16:00 prior-day fade) +5.24bp t=2.39 vs a required t≥3.0; its CFD confirm t=0.21.
  why: No every-day intraday window survives multiple-testing correction; this closed the last every-day intraday family on FTMO CFDs.
  refs: {scripts: [scripts/eda_tod_window_sweep.py], prs: [115]}
  visibility: public
  public_summary: >-
    We swept 134 "buy at time X, sell at time Y" intraday windows. None beat what chance produces
    when you test that many, and the best one did not hold up on the tradeable CFD.

- id: S084
  slug: overnight-gap-fade
  title: Overnight gap fade (gap_fade)
  family: intraday-mean-reversion
  mechanism: overnight-gap-reversion
  source: {type: internal, name: "Project EDA"}
  strategies: [gap_fade]
  instruments: [US100, US500]
  products: [CFD]
  timeframe: RTH open→close after a gap
  data: FTMO index CFD 1m
  tested: 2026-01-15
  closed: 2026-05-28
  verdict: SHELVED
  headline: First strategy ever to pass walk-forward; shelved the same day — both OOS legs one trade from negative, and decaying.
  why: The pass rested on a single trade on each leg.
  lesson: This is why the drop-the-best-trade check exists.
  visibility: public
  public_summary: >-
    Fading big overnight gaps was the first idea to pass our walk-forward test — and was shelved the
    same day, because removing one trade on each index turned it negative.
