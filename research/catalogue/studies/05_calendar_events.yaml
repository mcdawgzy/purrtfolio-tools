- id: S080
  slug: crypto-us-session-drift
  title: Bitcoin US-session / ETF-hours drift
  family: calendar-events
  mechanism: crypto-session-seasonality
  source: {type: paper, name: "Post-ETF decompositions 2024–26; QuantPedia; Concretum"}
  paper: P027
  instruments: [BTCUSD, ETHUSD]
  products: [crypto]
  timeframe: 30m sessions
  data: Binance 30m 2020-01→2026-06 (644 post-ETF sessions)
  tested: 2026-07-12
  closed: 2026-07-12
  verdict: REJECT
  headline: Inverted — post-ETF US hours −9.81bp/session on BTC (rest of day +11.52bp), ETH −30.86bp (t=−2.97).
  why: The ETF era reversed the pattern the headlines describe, and it is getting worse.
  refs: {scripts: [scripts/eda_crypto_us_session.py]}
  visibility: public
  public_summary: >-
    The popular claim that Bitcoin's gains happen during US trading hours since the ETFs launched is
    backwards in the data: those hours have been negative.

- id: S081
  slug: btc-closed-exchange-window
  title: Bitcoin closed-exchange window — long 21:00→23:00 UTC
  family: calendar-events
  mechanism: crypto-session-seasonality
  source: {type: paper, name: "QuantPedia 2022"}
  paper: P028
  strategies: [btc_closed_window]
  instruments: [BTCUSD, ETHUSD]
  products: [CFD, crypto]
  timeframe: 1m, 2-hour daily window
  data: Binance 2017–2019 (unpeeked), FTMO BTCUSD 2023–2026; 40 post-freeze forward trades
  tested: 2026-07-12
  closed: 2026-07-28
  verdict: FORWARD_FAILED
  headline: >-
    Strongest gate pass in the project (DSR 0.980, TEST +7.16bp/day t=+3.27, unpeeked 2017–19 +11.91bp).
    Forward test: 40 trades at −$7.21 vs a +$61.62 baseline — its own abort condition.
  why: The edge did not survive real out-of-sample time; the data replayed to the cent, so it was not an artefact.
  lesson: A high DSR on a walk-forward gate is not sufficient — only a forward test is.
  variants:
    - {name: "ETH cross-confirm", verdict: REJECT, result: "Effect is BTC-specific, not crypto-wide."}
    - {name: "BTC-only full gate (P028b)", verdict: PASS, result: "DSR 0.980, DD 7.69%."}
    - {name: "forward test (40 trades)", verdict: FORWARD_FAILED, result: "−$7.21/trade, win 50%, PF 0.94."}
  refs: {scripts: [scripts/eda_btc_closed_exchange_window.py, scripts/backtest_wf_btc_closed_window.py, scripts/probe_btc_swap_rollover.py], prs: [137, 141, 180]}
  visibility: public
  public_summary: >-
    Our strongest backtest ever — Bitcoin's 21:00–23:00 UTC window — passed every statistical test,
    then lost money in live forward testing. It is the clearest lesson we have that a great backtest
    is not proof.

