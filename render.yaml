services:
  - type: web
    name: 13f-tracker-api
    env: python
    plan: free
    buildCommand: |
          pip install -r requirements.txt
    startCommand: uvicorn "src.api:app" --host 0.0.0.0 --port $PORT
    envVars:
      - key: PURRTFOLIO_DB
        value: /opt/render/purrtfolio.db
      - key: MOMENTUM_DB
        value: /opt/render/momentum_data.db
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mcdawgzy.github.io,https://purrtfolio.onrender.com"
    # Render free tier: 750 hrs/mo, spins down after 15min idle, cold-start ~30s
    # The main DB (13F/SI/insider) is fetched from pre-downloaded /opt/render/purrtfolio.db
    # The slim momentum DB (price_history + corr_matrices, ~0.3MB) is downloaded
    # at startup in api.py from the GitHub Release. Updated daily by cron jobs.
