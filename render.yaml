# Trading Tools by Purrtfolio — free-tier web service (13F + macro + scanners)
# Auto-deploys on push to master.
services:
  - type: web
    name: 13f-tracker
    env: python
    plan: free
    buildCommand: |
          pip install -r requirements.txt
    preDeployCommand: |
          # Download fresh DB at build time so cold starts don't block the first request.
          # The 528MB DB download at build-time eliminates the 10s+ cold-start download
          # that was causing keepalive health checks to timeout.
          mkdir -p /opt/render
          curl -fSL -o /opt/render/purrtfolio.db.gz \
            https://github.com/mcdawgzy/purrtfolio-tools/releases/download/db-v2026-09-26/purrtfolio.db.gz
          python3 -c "import gzip, shutil; shutil.copyfileobj(gzip.open('''/opt/render/purrtfolio.db.gz''', '''rb'''), open('''/opt/render/purrtfolio.db''', '''wb'''))"
          rm -f /opt/render/purrtfolio.db.gz
    startCommand: uvicorn "src.api:app" --host 0.0.0.0 --port $PORT
    envVars:
      - key: PURRTFOLIO_DB
        value: /opt/render/purrtfolio.db
      - key: MOMENTUM_DB
        value: /opt/render/momentum_data.db
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mcdawgzy.github.io,https://purrtfolio.onrender.com"
    # Render free tier: 750 hrs/mo, spins down after 15min idle, cold-start ~30s
    # The main DB (13F/SI/insider) is fetched via preDeployCommand above at build time
    # The slim momentum DB (price_history + corr_matrices, ~0.3MB) is downloaded
    # at startup in api.py from the GitHub Release. Updated daily by cron jobs.
