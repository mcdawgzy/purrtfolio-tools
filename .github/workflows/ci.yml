name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r requirements-scanners.txt pytest httpx

      - name: Compile all Python
        run: python -m compileall -q src scanners scripts snapshots tests cron

      - name: API imports
        run: python -c "import src.api"

      - name: Frontend syntax
        run: for f in $(find static/js -name '*.js'); do node --input-type=module --check < "$f" || exit 1; done

      # API smoke tests skip here (no 500MB DB in CI); scanner import and
      # fresh-DB bootstrap tests run. Locally: python -m pytest tests -q
      - name: Tests
        run: python -m pytest tests -q
