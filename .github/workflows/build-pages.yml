name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy static/ to docs/
        run: |
          rm -rf docs
          cp -r static docs
          # Remove the snapshots double-nesting that cp -r can create
          if [ -d docs/snapshots/snapshots ]; then
            rm -rf docs/snapshots/snapshots
          fi

      - name: Commit docs/ to master
        run: |
          git config user.name mcdawgzy
          git config user.email mcdawgzy@users.noreply.github.com
          git add docs/
          # Only commit/push if there are actual changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: deploy static/ to docs/ [skip ci]"
            git push origin HEAD:master
          else
            echo "No changes to docs/"
          fi
