name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: 'master'

      - name: Setup deploy branch
        run: |
          git checkout --orphan gh-pages
          git rm -rf .

      - name: Copy static files
        run: |
          cp -r master/13f-scanner-web/static/* .
          cp -r master/13f-scanner-web/docs ./ 2>/dev/null || true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          git add -A
          git commit -m "Deploy static site to GitHub Pages [skip ci]" || echo "No changes to commit"
          git push --force origin gh-pages
